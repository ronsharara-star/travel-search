<!doctype html>
<html lang="he" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#111827">

<link rel="manifest" href="/manifest.webmanifest">

<title>Travel Search</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
  <div class="logo">🌍 <b>Travel Search</b></div>

  <div class="top-controls">
    <select id="lang">
      <option value="he">עברית</option>
      <option value="en">English</option>
    </select>

    <select id="currency">
      <option value="ILS">₪ שקל</option>
      <option value="USD">$ דולר</option>
      <option value="THB">฿ באט</option>
      <option value="EUR">€ אירו</option>
      <option value="GBP">£ פאונד</option>
      <option value="JPY">¥ ין</option>
      <option value="CAD">CAD</option>
      <option value="AUD">AUD</option>
      <option value="CHF">CHF</option>
      <option value="SGD">SGD</option>
    </select>
  </div>
</header>

<main>

<h1 id="mainTitle">✈️ טיסות ומלונות בכל העולם</h1>

<div class="tabs">
  <button id="fb">✈️ טיסות</button>
  <button id="hb">🏨 מלונות</button>
</div>

<!-- ================= FLIGHTS ================= -->

<section id="flights">

<h2>✈️ חיפוש טיסות</h2>

<div class="grid">

<div class="field">
<label>מוצא</label>
<input id="from" value="TLV" placeholder="לדוגמה TLV">
</div>

<div class="field">
<label>יעד</label>
<input id="to" value="BKK" placeholder="לדוגמה BKK">
</div>

<div class="field">
<label>📅 תאריך יציאה</label>
<input id="dep" type="date">
</div>

<div class="field">
<label>📅 תאריך חזרה</label>
<input id="ret" type="date">
</div>

<div class="field">
<label>👥 נוסעים</label>
<input id="adults" type="number" value="2" min="1">
</div>

</div>

<button class="search" id="fs">
🔎 חפש טיסות
</button>

<div class="filters">

<div class="field">
<label>✈️ חברת תעופה</label>
<select id="airlineFilter">
<option value="all">כל חברות התעופה</option>
</select>
</div>

<div class="field">
<label>🔄 עצירות</label>
<select id="stopsFilter">
<option value="all">הכול</option>
<option value="0">ללא עצירות</option>
<option value="1">עצירה אחת</option>
<option value="2">2+ עצירות</option>
</select>
</div>

<div class="field">
<label>💰 מיון</label>
<select id="flightSort">
<option value="priceAsc">הזול ביותר</option>
<option value="priceDesc">היקר ביותר</option>
<option value="duration">זמן טיסה</option>
</select>
</div>

</div>

<div id="flightResults"></div>

</section>


<!-- ================= HOTELS ================= -->

<section id="hotels" hidden>

<h2>🏨 חיפוש מלונות</h2>

<div class="grid">

<div class="field">
<label>📍 עיר / יעד</label>
<input id="city" value="Bangkok" placeholder="Bangkok">
</div>

<div class="field">
<label>📅 תאריך כניסה</label>
<input id="checkin" type="date">
</div>

<div class="field">
<label>📅 תאריך יציאה</label>
<input id="checkout" type="date">
</div>

<div class="field">
<label>👥 אורחים</label>
<input id="guests" type="number" value="2" min="1">
</div>

<div class="field">
<label>🛏️ חדרים</label>
<input id="rooms" type="number" value="1" min="1">
</div>

</div>

<button class="search" id="hs">
🔎 חפש מלונות
</button>

<div class="filters">

<div class="field">
<label>⭐ דירוג מינימום</label>
<select id="ratingFilter">
<option value="0">כל הדירוגים</option>
<option value="4">4+ ⭐</option>
<option value="4.5">4.5+ ⭐</option>
</select>
</div>

<div class="field">
<label>💰 מיון מחיר</label>
<select id="hotelSort">
<option value="priceAsc">הזול ביותר</option>
<option value="priceDesc">היקר ביותר</option>
<option value="rating">הדירוג הגבוה ביותר</option>
<option value="reviews">הכי הרבה ביקורות</option>
</select>
</div>

<div class="field checkbox">
<label>
<input type="checkbox" id="breakfastFilter">
 🍳 ארוחת בוקר
</label>
</div>

<div class="field checkbox">
<label>
<input type="checkbox" id="cancelFilter">
 ❌ ביטול חינם
</label>
</div>

</div>

<div id="hotelResults"></div>

<h2>📍 מלונות על המפה</h2>

<div id="map"></div>

</section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="/app.js"></script>

</body>
</html>
