<!doctype html>
<html lang="he" dir="rtl">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#111827">

    <link rel="manifest" href="/manifest.webmanifest">

    <title>Travel Search</title>

    <link rel="stylesheet" href="/style.css">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

<header>
    <b>🌍 Travel Search</b>

    <div>
        <select id="lang">
            <option value="he">🇮🇱 עברית</option>
            <option value="en">🇬🇧 English</option>
        </select>

        <select id="currency">
            <option value="ILS">₪ ILS</option>
            <option value="USD">$ USD</option>
            <option value="THB">฿ THB</option>
            <option value="EUR">€ EUR</option>
            <option value="GBP">£ GBP</option>
            <option value="JPY">¥ JPY</option>
            <option value="CAD">$ CAD</option>
            <option value="AUD">A$ AUD</option>
            <option value="CHF">CHF</option>
            <option value="SGD">S$ SGD</option>
        </select>
    </div>
</header>

<main>

    <h1 id="pageTitle">טיסות ומלונות בכל העולם</h1>

    <div class="tabs">
        <button id="fb">✈️ טיסות</button>
        <button id="hb">🏨 מלונות</button>
    </div>

    <!-- FLIGHTS -->

    <section id="flights">

        <div class="grid">

            <div class="field">
                <label id="fromLabel">מוצא</label>
                <input id="from"
                       value="TLV"
                       placeholder="TLV">
            </div>

            <div class="field">
                <label id="toLabel">יעד</label>
                <input id="to"
                       value="BKK"
                       placeholder="BKK">
            </div>

            <div class="field">
                <label id="depLabel">תאריך יציאה</label>
                <input id="dep" type="date">
            </div>

            <div class="field">
                <label id="retLabel">תאריך חזרה</label>
                <input id="ret" type="date">
            </div>

            <div class="field">
                <label id="adultsLabel">מספר נוסעים</label>
                <input id="adults"
                       type="number"
                       value="2"
                       min="1">
            </div>

        </div>

        <button class="search" id="fs">
            🔎 חפש טיסות
        </button>

        <div id="flightResults"></div>

    </section>


    <!-- HOTELS -->

    <section id="hotels" hidden>

        <div class="grid">

            <div class="field">
                <label id="cityLabel">עיר / יעד</label>
                <input id="city"
                       value="Bangkok"
                       placeholder="Bangkok">
            </div>

            <div class="field">
                <label id="checkinLabel">תאריך כניסה</label>
                <input id="checkin" type="date">
            </div>

            <div class="field">
                <label id="checkoutLabel">תאריך יציאה</label>
                <input id="checkout" type="date">
            </div>

            <div class="field">
                <label id="guestsLabel">מספר אורחים</label>
                <input id="guests"
                       type="number"
                       value="2"
                       min="1">
            </div>

            <div class="field">
                <label id="roomsLabel">מספר חדרים</label>
                <input id="rooms"
                       type="number"
                       value="1"
                       min="1">
            </div>

        </div>

        <button class="search" id="hs">
            🔎 חפש מלונות
        </button>

        <div id="hotelResults"></div>

        <div id="map"></div>

    </section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="/app.js"></script>

</body>
</html>
