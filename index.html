<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="/manifest.webmanifest">

  <title>Travel Search</title>

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

<header>
  <div class="logo">🌍 Travel Search</div>

  <div class="settings">
    <select id="lang">
      <option value="he">עברית</option>
      <option value="en">English</option>
    </select>

    <select id="currency">
      <option value="ILS">₪ שקל</option>
      <option value="USD">$ דולר</option>
      <option value="THB">฿ באט</option>
      <option value="EUR">€ אירו</option>
      <option value="GBP">£ פאונד</option>
      <option value="JPY">¥ ין</option>
      <option value="CAD">CAD דולר קנדי</option>
      <option value="AUD">AUD דולר אוסטרלי</option>
      <option value="CHF">CHF פרנק שווייצרי</option>
      <option value="SGD">SGD דולר סינגפורי</option>
    </select>
  </div>
</header>

<main>

  <h1>✈️ טיסות ומלונות בכל העולם</h1>

  <div class="tabs">
    <button id="fb">✈️ טיסות</button>
    <button id="hb">🏨 מלונות</button>
  </div>


  <!-- טיסות -->

  <section id="flights">

    <div class="form">

      <div class="field">
        <label>מוצא</label>
        <input id="from"
               value="TLV"
               placeholder="לדוגמה TLV">
      </div>

      <div class="field">
        <label>יעד</label>
        <input id="to"
               value="BKK"
               placeholder="לדוגמה BKK">
      </div>

      <div class="field">
        <label>📅 תאריך יציאה</label>
        <input id="dep" type="date">
      </div>

      <div class="field">
        <label>📅 תאריך חזרה</label>
        <input id="ret" type="date">
      </div>

      <div class="field">
        <label>👤 מספר נוסעים</label>
        <input id="adults"
               type="number"
               value="2"
               min="1">
      </div>

    </div>

    <button class="search" id="fs">
      🔎 חפש טיסות
    </button>
    
    <div id="flightFilters"></div>
<div id="flightResults"></div>

  </section>


  <!-- מלונות -->

  <section id="hotels" hidden>

    <div class="form">

      <div class="field">
        <label>📍 עיר / יעד</label>
        <input id="city"
               value="Bangkok"
               placeholder="לדוגמה Bangkok">
      </div>

      <div class="field">
        <label>📅 תאריך כניסה</label>
        <input id="checkin" type="date">
      </div>

      <div class="field">
        <label>📅 תאריך יציאה</label>
        <input id="checkout" type="date">
      </div>

      <div class="field">
        <label>👤 מספר אורחים</label>
        <input id="guests"
               type="number"
               value="2"
               min="1">
      </div>

      <div class="field">
        <label>🛏️ מספר חדרים</label>
        <input id="rooms"
               type="number"
               value="1"
               min="1">
      </div>

    </div>

    <button class="search" id="hs">
      🔎 חפש מלונות
    </button>

<div id="hotelFilters"></div>
<div id="hotelResults"></div>
    
    <h2 class="map-title">📍 מלונות על המפה</h2>

    <div id="map"></div>

  </section>

</main>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/app.js"></script>

</body>
</html>
