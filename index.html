<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><title>Travel Search</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header><b>🌍 Travel Search</b><div><select id="lang"><option value="he">עברית</option><option value="en">English</option></select><select id="currency"><option>ILS</option><option>USD</option><option>THB</option><option>EUR</option><option>GBP</option><option>JPY</option><option>CAD</option><option>AUD</option><option>CHF</option><option>SGD</option></select></div></header><main><h1>טיסות ומלונות בכל העולם</h1><div class="tabs"><button id="fb">✈️ טיסות</button><button id="hb">🏨 מלונות</button></div><section id="flights"><div class="grid"><input id="from" value="TLV" placeholder="מוצא"><input id="to" value="BKK" placeholder="יעד"><input id="dep" type="date"><input id="ret" type="date"><input id="adults" type="number" value="2" min="1"></div><button class="search" id="fs">🔎 חפש טיסות</button><div id="flightResults"></div></section><section id="hotels" hidden><div class="grid"><input id="city" value="Bangkok" placeholder="עיר"><input id="checkin" type="date"><input id="checkout" type="date"><input id="guests" type="number" value="2" min="1"><input id="rooms" type="number" value="1" min="1"></div><button class="search" id="hs">🔎 חפש מלונות</button><div id="hotelResults"></div><div id="map"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/static/app.js"></script></body></html>
